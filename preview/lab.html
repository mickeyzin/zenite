<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Laboratório de frascos · Zênite</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Manrope:wght@400;600&display=swap">
<style>
  :root { color-scheme: dark; --bg: #03040b; --fg: #f5f3ff; --muted: #a9b0cf; --line: rgba(160,190,255,.2); --accent: #31c7f3; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: "Manrope", system-ui, sans-serif; }
  #lab { position: fixed; inset: 0; }
  .bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between;
         padding: 14px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(var(--bg), transparent); }
  .bar h1 { font: 500 1.2rem "Cormorant Garamond", Georgia, serif; letter-spacing: .2em; margin: 0; }
  nav { display: flex; flex-wrap: wrap; gap: .4rem; }
  nav a { color: var(--muted); text-decoration: none; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; padding: .45rem .8rem; border: 1px solid var(--line); border-radius: 999px; }
  nav a[aria-current="page"] { color: var(--fg); border-color: var(--accent); }
  nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: .72rem; letter-spacing: .1em; z-index: 2; padding: 0 16px; }
</style>
</head>
<body>
<header class="bar">
  <h1>LABORATÓRIO</h1>
  <nav aria-label="Frascos">
    <a data-slug="lattafa-art-of-universe" href="#lattafa-art-of-universe">Art of Universe</a>

    <a data-slug="balanco" href="#balanco">Testar balanço do líquido</a>
    <a href="index.html">← Voltar à cena</a>
  </nav>
</header>
<div id="lab"></div>
<p class="hint">Arraste para girar · role ou faça pinça para aproximar</p>
<script type="module" src="lab.js"></script>

</html>
